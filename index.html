.pnl .hd{display:flex;align-items:center;gap:20px}
.pnl h3{font-family:var(--serif);font-size:53px;line-height:1.1}
.pnl .def{font-size:39px;line-height:1.3;color:var(--soft)}

.g4 .pnl{padding:24px}.g4 h3{font-size:44px}.g4 .def{font-size:34px}.g4 .ex{font-size:30px;padding:12px 16px}

.gr{flex-wrap:wrap;height:640px;align-content:flex-start}
.rule{flex:none;width:726px;height:300px;background:var(--t);border:1px solid rgba(0,0,0,.1);border-left:10px solid var(--c);border-radius:16px;padding:22px 28px;display:flex;gap:22px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.rule .n{font-family:var(--serif);font-size:97px;line-height:1;font-weight:700;color:var(--c);width:100px;flex:none;text-align:center}
.rule h3{font-family:var(--serif);font-size:39px;line-height:1.15;margin-bottom:8px}
.rule .def{font-size:32px;line-height:1.25;color:var(--soft);margin-bottom:10px}
.rule .ex{font-size:32px;line-height:1.3;border-left:6px solid var(--c);padding-left:14px}
.cover-l{position:absolute;left:0;top:0;bottom:0;width:1190px;background:#EAF4EE}
.ey{position:absolute;font-size:32px;font-weight:700;color:#A86A12;letter-spacing:1px}
.big{position:absolute;font-family:var(--serif);font-weight:700;line-height:1.08;color:var(--ink);letter-spacing:-1px}
.big span{color:#C0392B}
.names{position:absolute;font-size:37px;line-height:1.4;color:var(--soft)}
.names small{display:block;font-size:30px;font-weight:700;color:#A86A12;margin-bottom:10px}
.demo{position:absolute;left:214px;top:335px;width:1492px;display:flex;flex-direction:column;gap:22px}
.slide.active .demo>*{animation:up .6s both}
.slide.active .demo>*:nth-child(2){animation-delay:.12s}.slide.active .demo>*:nth-child(3){animation-delay:.24s}.slide.active .demo>*:nth-child(4){animation-delay:.36s}.slide.active .demo>*:nth-child(5){animation-delay:.48s}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.net{position:relative;display:flex;align-items:center;gap:30px}
.net::before{content:'';position:absolute;left:8%;right:8%;top:50%;height:4px;background:repeating-linear-gradient(90deg,var(--c) 0 16px,transparent 16px 32px);opacity:.35;animation:flow 1s linear infinite}
@keyframes flow{to{background-position:32px 0}}
.nd{position:relative;z-index:1;flex:1;min-width:0;background:var(--t);border:1px solid rgba(0,0,0,.12);border-top:6px solid var(--c);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;transition:all .3s;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.nd::before{content:'';position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:50%;background:#6DBF8B}
.nd b{font-family:var(--serif);font-size:39px;line-height:1.1}.nd span{color:var(--soft);font-size:31px;min-height:34px}
.nd.hit{background:var(--c);color:var(--on);transform:translateY(-8px) scale(1.04)}.nd.hit span{color:var(--on)}
.nd.down{filter:grayscale(1);opacity:.6;border-top-color:#C65A52}.nd.down::before{background:#C65A52}
.nd.ok{background:#CDEBD7;animation:pulse .5s}.nd.no{background:#F6D1CD;animation:shake .4s}
.nd.het{border-top-color:#7FB0C9}.nd.het:nth-child(3){border-top-color:#E58C7C}.nd.het:nth-child(4){border-top-color:#E0B15A}
.ar{font-size:69px;color:var(--c);flex:none;z-index:1}
@keyframes pulse{50%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.dot{position:absolute;width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--c);opacity:0;font-size:23px;text-align:center;line-height:28px;z-index:4}
.trail{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);z-index:3;animation:fade .7s forwards}
@keyframes fade{to{opacity:0;transform:scale(.2)}}
.ping{position:absolute;inset:0;border-radius:14px;border:4px solid var(--c);animation:pg .9s ease-out forwards;pointer-events:none;z-index:2}
@keyframes pg{to{transform:scale(1.3);opacity:0}}
.row{display:flex;gap:16px;align-items:center;font-size:34px;color:var(--soft);flex-wrap:wrap}
.btn{font:700 28px var(--sans);background:var(--c);color:var(--on);border:2px solid var(--c);border-radius:12px;padding:10px 24px;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:scale(.96)}.btn.alt{background:transparent;color:var(--c)}
.btn.sm{font-size:30px;padding:2px 16px}

.msg b{color:var(--c)}
.tb{border-collapse:collapse;font-size:30px;margin-top:10px}.tb td,.tb th{padding:5px 22px;text-align:left;border-bottom:1px solid rgba(0,0,0,.14)}.tb th{color:var(--c)}.tb tr{animation:up .4s both}

.ln{animation:up .3s both}.ln.er{color:#B3261E}.ln.ok{color:#1F7A45}

<script>
(function(){
  var stage=document.getElementById('stage'), slides=[].slice.call(document.querySelectorAll('.slide'));
  var cur=-1, full=/[?&]full/.test(location.search), timers=[];
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+') translate(-50%,-50%)';}
  addEventListener('resize',fit);fit();
  function apply(sl,st){sl.querySelectorAll('[data-step]').forEach(function(e){var n=+e.dataset.step;if(n===0)return;if(n<=st)e.classList.add('on');else e.classList.remove('on');});}
  function clear(){timers.forEach(clearTimeout);timers=[];}
  function schedule(sl){var steps={},last=0;sl.querySelectorAll('[data-step]').forEach(function(e){var n=+e.dataset.step;if(n>0)steps[n]=1});
    Object.keys(steps).map(Number).sort(function(a,b){return a-b}).forEach(function(n){var at=Math.max(300+(n-1)*600,last);last=at;timers.push(setTimeout(function(){apply(sl,n)},at));});}
  function paint(){slides.forEach(function(s,i){s.classList.toggle('active',i===cur)});try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
  function go(i,instant){if(i<0||i>=slides.length)return;clear();cur=i;var sl=slides[i];slides.forEach(function(s,k){if(k!==i)apply(s,0)});
    sl.querySelectorAll('[data-step="0"]').forEach(function(e){e.classList.remove('on');timers.push(setTimeout(function(){e.classList.add('on')},300))});
    apply(sl,0);paint();if(instant||full){apply(sl,9999)}else{schedule(sl)}}
  function next(){if(cur<slides.length-1)go(cur+1,false)}
  function prev(){if(cur>0)go(cur-1,true)}
  addEventListener('keydown',function(e){var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next()}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev()}
    else if(k==='Home'){go(0,false)}else if(k==='End'){go(slides.length-1,false)}
    else if(k==='r'||k==='R'){go(cur,false)}else if(k==='f'||k==='F'){fs()}});
  function fs(){var d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)}else{document.exitFullscreen()}}
  document.addEventListener('click',function(){next()});
  var tx=null;addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){dx<0?next():prev()}});
  var start=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));
  go(start,false);
})();
</script>
